<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Newsreader:opsz,wght@6..72,500&amp;display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="blotter-themes.js"></script>
<style>body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-ui);font-size:13px}*{box-sizing:border-box}:focus-visible{outline:2px solid var(--color-focus-ring);outline-offset:2px}input::placeholder,textarea::placeholder{color:var(--color-text-muted)}</style>
</helmet>
<div role="dialog" style="width:100%;max-width:580px;border-radius:var(--radius-lg);background:var(--color-surface-raised);box-shadow:var(--shadow-overlay);color:var(--color-text);font-family:var(--font-ui);font-size:var(--text-base);display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:8px;padding:14px 18px 0">
    <span style="font-size:12px;color:var(--color-text-muted)">Edit item</span>
    <span style="display:flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--color-border-strong);color:var(--color-text-muted)"><i class="ph ph-arrows-clockwise"></i>Recurring</span>
    <span style="flex:1"></span>
    <button onClick="{{ onClose }}" title="Close (Esc)" style="width:26px;height:26px;display:grid;place-items:center;border:0;border-radius:var(--radius-md);background:transparent;color:var(--color-text-muted);cursor:pointer" style-hover="background:var(--color-hover)"><i class="ph ph-x"></i></button>
  </div>
  <div style="padding:6px 18px 0">
    <input value="Morning run" style="width:100%;height:40px;font:inherit;font-family:var(--font-heading);font-weight:var(--heading-weight);font-size:var(--text-xl);background:transparent;border:0;outline:2px solid var(--color-focus-ring);outline-offset:2px;border-radius:4px;color:var(--color-text);padding:0 4px">
  </div>
  <div style="display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px 14px;align-items:center;padding:16px 18px">
    <span style="color:var(--color-text-muted)">Kind</span>
    <div style="display:flex;gap:2px;padding:2px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);justify-self:start"><sc-for list="{{ kinds }}" as="k" hint-placeholder-count="3"><button onClick="{{ k.onClick }}" style="{{ k.style }}"><i class="ph {{ k.icon }}"></i>{{ k.label }}</button></sc-for></div>
    <span style="color:var(--color-text-muted)">Anchoring</span>
    <div style="display:flex;align-items:center;gap:10px">
      <div style="display:flex;gap:2px;padding:2px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface)"><sc-for list="{{ anchors }}" as="k" hint-placeholder-count="2"><button onClick="{{ k.onClick }}" style="{{ k.style }}"><i class="ph {{ k.icon }}"></i>{{ k.label }}</button></sc-for></div>
      <span style="font-size:11px;color:var(--color-text-muted);line-height:1.4">{{ anchorHelp }}</span>
    </div>
    <span style="color:var(--color-text-muted)">When</span>
    <div style="display:flex;gap:6px">
      <span style="display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--color-border-strong);border-radius:var(--radius-md);background:var(--color-bg);font-family:var(--font-mono);font-size:12px"><i class="ph ph-calendar-blank" style="color:var(--color-text-muted)"></i>Tue 13 Oct</span>
      <span style="display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--color-border-strong);border-radius:var(--radius-md);background:var(--color-bg);font-family:var(--font-mono);font-size:12px"><i class="ph ph-clock" style="color:var(--color-text-muted)"></i>07:15</span>
      <span style="display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--color-border-strong);border-radius:var(--radius-md);background:var(--color-bg);font-family:var(--font-mono);font-size:12px"><i class="ph ph-timer" style="color:var(--color-text-muted)"></i>30m</span>
      <span style="display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px dashed var(--color-border-strong);border-radius:var(--radius-md);color:var(--color-text-muted);font-size:12px"><i class="ph ph-flag-checkered"></i>Due date</span>
    </div>
    <span style="color:var(--color-text-muted)">Priority</span>
    <div style="display:flex;gap:2px;padding:2px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);justify-self:start"><sc-for list="{{ pris }}" as="k" hint-placeholder-count="4"><button onClick="{{ k.onClick }}" style="{{ k.style }}">{{ k.label }}</button></sc-for></div>
    <span style="color:var(--color-text-muted)">Tags</span>
    <div style="display:flex;gap:6px;align-items:center">
      <span style="display:flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 10px;border-radius:99px;border:1px solid var(--color-border-strong);font-size:12px"><span style="width:7px;height:7px;border-radius:50%;background:var(--tag-personal)"></span>personal<i class="ph ph-x" style="color:var(--color-text-muted);font-size:11px"></i></span>
      <span style="display:flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 10px;border-radius:99px;border:1px solid var(--color-border-strong);font-size:12px"><span style="width:7px;height:7px;border-radius:50%;background:var(--tag-health)"></span>health<i class="ph ph-x" style="color:var(--color-text-muted);font-size:11px"></i></span>
      <span style="display:flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:99px;border:1px dashed var(--color-border-strong);font-size:12px;color:var(--color-text-muted)"><i class="ph ph-plus"></i>Tag</span>
    </div>
    <span style="color:var(--color-text-muted)">Repeats</span>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border:1px solid var(--color-border-strong);border-radius:var(--radius-md);background:var(--color-bg);min-width:150px"><span style="flex:1">Every weekday</span><i class="ph ph-caret-up-down" style="color:var(--color-text-muted)"></i></span>
      <span style="font-family:var(--font-mono);font-size:10.5px;color:var(--color-text-muted)">RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR</span>
    </div>
    <span style="color:var(--color-text-muted)">Reminders</span>
    <div style="display:flex;gap:6px;align-items:center">
      <span style="display:flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 10px;border-radius:var(--radius-md);border:1px solid var(--color-border-strong);font-family:var(--font-mono);font-size:12px"><i class="ph ph-bell" style="color:var(--color-text-muted)"></i>10m before<i class="ph ph-x" style="color:var(--color-text-muted);font-size:11px"></i></span>
      <span style="display:flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:var(--radius-md);border:1px dashed var(--color-border-strong);font-size:12px;color:var(--color-text-muted)"><i class="ph ph-plus"></i>Reminder</span>
    </div>
    <span style="color:var(--color-text-muted);align-self:start;padding-top:6px">Notes</span>
    <textarea rows="2" placeholder="Add notes…" style="font:inherit;padding:7px 10px;border:1px solid var(--color-border-strong);border-radius:var(--radius-md);background:var(--color-bg);color:var(--color-text);resize:vertical">5 km loop, easy pace.</textarea>
  </div>
  <div style="margin:0 18px;padding:12px;border-radius:var(--radius-md);border:1px solid var(--color-border-strong);background:var(--color-surface);display:flex;flex-direction:column;gap:8px">
    <span style="font-size:12px;font-weight:500">This is a recurring item. Apply changes to:</span>
    <div role="radiogroup" style="display:flex;gap:6px"><sc-for list="{{ scopes }}" as="sc" hint-placeholder-count="3"><button onClick="{{ sc.onClick }}" style="{{ sc.style }}"><span style="{{ sc.dot }}"></span>{{ sc.label }}</button></sc-for></div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;padding:14px 18px">
    <button style="height:30px;padding:0 10px;border:1px solid transparent;border-radius:var(--radius-md);background:transparent;color:var(--color-danger);font:inherit;cursor:pointer;display:flex;align-items:center;gap:6px" style-hover="background:var(--color-hover)"><i class="ph ph-trash"></i>Delete occurrence<span style="font-family:var(--font-mono);font-size:10px;color:var(--color-text-muted)">Del</span></button>
    <span style="flex:1"></span>
    <span style="font-family:var(--font-mono);font-size:10.5px;color:var(--color-text-muted)">created by you · edited 07:02</span>
    <button onClick="{{ onClose }}" style="height:30px;padding:0 12px;border:1px solid var(--color-border-strong);border-radius:var(--radius-md);background:transparent;color:var(--color-text);font:inherit;cursor:pointer">Cancel</button>
    <button onClick="{{ onClose }}" style="height:30px;padding:0 12px;border:1px solid var(--color-accent);border-radius:var(--radius-md);background:var(--color-accent);color:var(--color-on-accent);font:inherit;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px">Save<span style="font-family:var(--font-mono);font-size:10px;padding:0 4px;border-radius:3px;background:color-mix(in srgb,var(--color-on-accent) 18%,transparent)">Ctrl ↵</span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:580,&quot;height&quot;:720},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { kind: 'task', anchor: 'flexible', pri: 0, scope: 'following' };
  renderVals() {
    const s = this.state;
    const seg = (on) => ({ display: 'flex', alignItems: 'center', gap: 6, height: 26, padding: '0 10px', border: 0, borderRadius: 4, font: 'inherit', fontSize: 12, cursor: 'pointer',
      background: on ? 'var(--color-surface-raised)' : 'transparent', color: on ? 'var(--color-text)' : 'var(--color-text-muted)', boxShadow: on ? '0 0 0 1px var(--color-border-strong)' : 'none', fontWeight: on ? 500 : 400 });
    const mk = (key, arr) => arr.map(([v, label, icon]) => ({ label, icon, style: seg(s[key] === v), onClick: () => this.setState({ [key]: v }) }));
    const scopes = [['this', 'This occurrence'], ['following', 'This and following'], ['all', 'All occurrences']].map(([v, label]) => {
      const on = s.scope === v;
      return { label, onClick: () => this.setState({ scope: v }),
        style: { flex: 1, display: 'flex', alignItems: 'center', gap: 8, height: 32, padding: '0 10px', borderRadius: 'var(--radius-md)', font: 'inherit', fontSize: 12, cursor: 'pointer', color: 'var(--color-text)',
          border: '1px solid ' + (on ? 'var(--color-accent)' : 'var(--color-border-strong)'), background: on ? 'var(--color-accent-tint)' : 'var(--color-bg)' },
        dot: { width: 14, height: 14, borderRadius: '50%', flex: 'none', border: on ? '4px solid var(--color-accent)' : '1.5px solid var(--color-border-strong)' } };
    });
    return { kinds: mk('kind', [['task', 'Task', 'ph-check-square'], ['event', 'Event', 'ph-calendar'], ['reminder', 'Reminder', 'ph-bell']]),
      anchors: mk('anchor', [['flexible', 'Flexible', 'ph-arrows-out-line-horizontal'], ['fixed', 'Fixed', 'ph-push-pin']]),
      pris: mk('pri', [[0, 'None'], [1, '!1'], [2, '!2'], [3, '!3']]), scopes,
      anchorHelp: s.anchor === 'fixed' ? 'Stays exactly here, even inside block-outs.' : 'Can be moved by auto-slot. Never placed in block-outs.',
      onClose: () => this.props.onClose && this.props.onClose() };
  }
}
</script>
</body>
</html>
