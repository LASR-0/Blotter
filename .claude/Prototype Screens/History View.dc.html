<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Newsreader:opsz,wght@6..72,500&amp;display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<script src="blotter-themes.js"></script>
<style>body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-ui);font-size:13px}*{box-sizing:border-box}a{color:var(--color-accent-text)}a:hover{color:var(--color-text)}:focus-visible{outline:2px solid var(--color-focus-ring);outline-offset:2px}input::placeholder{color:var(--color-text-muted)}</style>
</helmet>
<div style="height:100%;overflow:auto;background:var(--color-bg);color:var(--color-text);font-family:var(--font-ui);font-size:var(--text-base)">
  <div style="max-width:880px;padding:20px 28px 40px;display:flex;flex-direction:column;gap:20px">
    <div style="display:flex;align-items:baseline;gap:10px">
      <h1 style="margin:0;font-family:var(--font-heading);font-weight:var(--heading-weight);font-size:var(--text-xl)">History</h1>
      <span style="font-family:var(--font-mono);font-size:12px;color:var(--color-text-muted)">completed items</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 2fr;gap:0;border:1px solid var(--color-border);border-radius:var(--radius-lg);overflow:hidden">
      <sc-for list="{{ stats }}" as="s" hint-placeholder-count="4">
        <div style="padding:14px 16px;border-right:1px solid var(--color-border);display:flex;flex-direction:column;gap:4px">
          <span style="font-size:11px;color:var(--color-text-muted)">{{ s.label }}</span>
          <span style="font-family:var(--font-heading);font-weight:var(--heading-weight);font-size:24px;letter-spacing:-.01em">{{ s.value }}</span>
        </div>
      </sc-for>
      <div style="padding:14px 16px;display:flex;flex-direction:column;gap:6px">
        <span style="font-size:11px;color:var(--color-text-muted)">Last 14 days</span>
        <div style="flex:1;display:flex;align-items:flex-end;gap:3px;min-height:34px">
          <sc-for list="{{ bars }}" as="b" hint-placeholder-count="14"><span title="{{ b.tip }}" style="flex:1;height:{{ b.h }};background:{{ b.c }};border-radius:2px"></span></sc-for>
        </div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border:1px solid var(--color-border-strong);border-radius:var(--radius-md);width:220px;background:var(--color-surface)"><i class="ph ph-magnifying-glass" style="color:var(--color-text-muted)"></i><input placeholder="Search completed…" style="flex:1;min-width:0;background:transparent;border:0;outline:none;font:inherit;color:var(--color-text)"></div>
      <button style="display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--color-border-strong);border-radius:var(--radius-md);background:var(--color-surface);color:var(--color-text);font:inherit;cursor:pointer"><i class="ph ph-calendar-blank"></i>Last 30 days<i class="ph ph-caret-down" style="color:var(--color-text-muted)"></i></button>
      <span style="width:1px;height:18px;background:var(--color-border);margin:0 4px"></span>
      <sc-for list="{{ tags }}" as="t" hint-placeholder-count="5">
        <button onClick="{{ t.onClick }}" style="{{ t.style }}"><span style="width:7px;height:7px;border-radius:50%;background:{{ t.color }}"></span>{{ t.name }}</button>
      </sc-for>
    </div>
    <div style="display:flex;flex-direction:column;gap:18px">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
        <div style="display:flex;flex-direction:column;gap:2px">
          <div style="display:flex;align-items:baseline;gap:8px;padding:0 8px 6px;border-bottom:1px solid var(--color-border)">
            <span style="font-weight:600">{{ g.label }}</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--color-text-muted)">{{ g.date }}</span><span style="flex:1"></span><span style="font-family:var(--font-mono);font-size:11px;color:var(--color-text-muted)">{{ g.n }} done</span>
          </div>
          <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
            <div style="display:grid;grid-template-columns:20px minmax(0,1fr) auto 64px;gap:10px;align-items:center;height:34px;padding:0 8px;border-radius:var(--radius-md)" style-hover="background:var(--color-hover)">
              <span style="width:16px;height:16px;border-radius:4px;background:var(--color-accent);color:var(--color-on-accent);display:grid;place-items:center"><i class="ph-bold ph-check" style="font-size:10px"></i></span>
              <span style="display:flex;gap:10px;align-items:center;min-width:0"><span style="text-decoration:line-through;color:var(--color-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ it.title }}</span><span style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--color-text-muted)"><span style="width:6px;height:6px;border-radius:50%;background:{{ it.color }}"></span>{{ it.tag }}</span></span>
              <span style="font-family:var(--font-mono);font-size:10px;color:var(--color-text-muted);padding:0 5px;border:1px solid var(--color-border);border-radius:3px;opacity:{{ it.srcOp }}">{{ it.src }}</span>
              <span style="font-family:var(--font-mono);font-size:12px;color:var(--color-text-muted);text-align:right">✓ {{ it.at }}</span>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { off: {} };
  renderVals() {
    const s = this.state;
    const data = [
      ['Today', 'Tue 13 Oct', [['Pay electricity bill', 'home', '08:04', 'user'], ['Morning run', 'personal', '07:48', 'user']]],
      ['Yesterday', 'Mon 12 Oct', [['Read', 'personal', '21:06', 'user'], ['Groceries', 'shopping', '18:21', 'user'], ['Reply to strata manager', 'home', '17:40', 'ai'], ['Morning run', 'personal', '07:46', 'user']]],
      ['Sunday', 'Sun 11 Oct', [['Weekly review', 'work', '16:31', 'user'], ['Hardware store', 'home', '13:12', 'mcp'], ['Long run', 'personal', '10:52', 'user']]],
      ['Saturday', 'Sat 10 Oct', [['Clean gutters', 'home', '15:20', 'user'], ['Farmers market', 'shopping', '09:58', 'user']]]
    ];
    const groups = data.map(([label, date, items]) => {
      const its = items.filter(i => !s.off[i[1]]).map(([title, tag, at, src]) => ({ title, tag, at, src: src === 'user' ? '' : src, srcOp: src === 'user' ? 0 : 1, color: `var(--tag-${tag})` }));
      return { label, date, items: its, n: its.length };
    }).filter(g => g.n);
    const vals = [3, 5, 4, 6, 2, 4, 7, 5, 3, 4, 6, 4, 5, 2];
    const bars = vals.map((v, i) => ({ h: (v / 7 * 100) + '%', c: i === 13 ? 'var(--color-accent)' : 'var(--heat-3)', tip: `${v} completed` }));
    const tags = ['work', 'health', 'home', 'shopping', 'personal'].map(n => { const on = !s.off[n]; return { name: n, color: `var(--tag-${n})`,
      style: { display: 'flex', alignItems: 'center', gap: 6, height: 26, padding: '0 10px', borderRadius: 99, font: 'inherit', fontSize: 12, cursor: 'pointer',
        border: '1px solid ' + (on ? 'var(--color-border-strong)' : 'var(--color-border)'), background: on ? 'var(--color-surface-raised)' : 'transparent', color: on ? 'var(--color-text)' : 'var(--color-text-muted)', opacity: on ? 1 : 0.7 },
      onClick: () => this.setState(st => ({ off: { ...st.off, [n]: !st.off[n] } })) }; });
    return { groups, bars, tags, stats: [{ label: 'Current streak', value: '9 days' }, { label: 'This week', value: '23' }, { label: 'This month', value: '87' }, { label: 'Best streak', value: '21 days' }] };
  }
}
</script>
</body>
</html>
