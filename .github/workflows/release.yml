name: Release

# Builds every v1 artifact into a draft GitHub release when a version tag
# is pushed: Windows NSIS and MSI installers, a Linux AppImage and .deb,
# and a Flatpak bundle. A manual run builds them as workflow artifacts
# only. The AUR package builds from the tag's source (packaging/aur).
# Publish the draft once the smoke checks pass.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  linux:
    name: Linux AppImage and .deb
    # The oldest supported Ubuntu, so the AppImage runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles deb,appimage
      - name: Keep the .deb for the Flatpak
        run: cp target/release/bundle/deb/*.deb blotter.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            blotter.deb
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  flatpak:
    name: Flatpak
    needs: linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: linux-bundles
      - name: Stage the .deb and the shared modules
        run: |
          cp linux-bundles/blotter.deb packaging/flatpak/blotter.deb
          git clone --depth 1 https://github.com/flathub/shared-modules packaging/flatpak/shared-modules
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Blotter.flatpak
          manifest-path: packaging/flatpak/io.github.lasr0.Blotter.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: Blotter.flatpak
