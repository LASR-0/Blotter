[workspace]
resolver = "3"
members = ["crates/blotter-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/LASR-0/blotter"
rust-version = "1.85"

[workspace.dependencies]
blotter-core = { path = "crates/blotter-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[profile.release]
codegen-units = 1
lto = true
strip = true
