[package]
name = "blotter"
description = "A keyboard-first daily planner with an AI that pencils things in for you."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "blotter"

[lib]
name = "blotter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
blotter-core.workspace = true
blotter-mcp.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
chrono-tz = "0.10.4"
dirs = "7.0.0"
futures-util = "0.3.32"
iana-time-zone = "0.1.65"
keyring = "4.2.0"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-notification = "2.4.0"
tauri-plugin-single-instance = "2.5.3"
tokio = { version = "1.53.3", features = ["io-util", "macros", "process", "rt", "time"] }

[lints]
workspace = true
